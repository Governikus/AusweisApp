spec:
  inputs:
    revision:
      description: "Use revision of hg repository."
      type: string
      default: "default"
    release:
      description: "Indicates whether the pipeline is being used for a release."
      type: boolean
      default: false
---

image: ${DOCKER_REGISTRY_MIRROR}/alpine

variables:
  GIT_STRATEGY: empty
  PIPELINE_NAME: '$CI_COMMIT_TITLE'

workflow:
  name: '$PIPELINE_NAME'
  rules:
    - if: '$REVIEWBOARD_REVIEW_REQUEST != null'
      variables:
        PIPELINE_NAME: '${REVIEWBOARD_REVIEW_REQUEST} / ${REVIEWBOARD_DIFF_REVISION}'
    - if: '$PATCH_IDENTIFIER != null'
      variables:
        PIPELINE_NAME: 'Rev: $[[ inputs.revision ]] | Patch: ${PATCH_IDENTIFIER}'
    - if: '$SELECT_JOB_REGEX != null'
      variables:
        PIPELINE_NAME: 'Rev: $[[ inputs.revision ]] | ${SELECT_JOB_REGEX}'
    - when: always
      variables:
        PIPELINE_NAME: 'Rev: $[[ inputs.revision ]]'

stages:
  - generator
  - trigger

Bootstrap:
  stage: generator
  tags:
    - $BOOTSTRAP_RUNNER
  variables:
    VIRTUAL_ENV: $CI_PROJECT_DIR/venv
  before_script:
    - env
    - |
      if [ -n "$MIRROR_ALPINE" ]; then
        sed -i "s|https://[^/]*/alpine/|$MIRROR_ALPINE/|g" /etc/apk/repositories
      fi
      if [ -n "$REPOSITORY" ]; then
        apk add mercurial
      else
        apk add git
      fi
    - apk add cmake uv python3
    - uv venv $VIRTUAL_ENV
    - source $VIRTUAL_ENV/bin/activate
  script:
    - |
      if [ -n "$REPOSITORY" ]; then
        hg clone --stream ${REPOSITORY} -u $[[ inputs.revision ]] source
      else
        git clone "$CI_REPOSITORY_URL" source
        git -c advice.detachedHead=false -C source checkout $CI_COMMIT_SHA
      fi
    - cmake -DSPLIT=OFF -DRELEASE="$[[ inputs.release ]]" -P source/ci.cmake
  artifacts:
    paths:
      - gitlab-ci-child.yml
    reports:
      dotenv: env

execute:
  stage: trigger
  trigger:
    include:
      - artifact: gitlab-ci-child.yml
        job: Bootstrap
    strategy: depend
    forward:
      pipeline_variables: true
